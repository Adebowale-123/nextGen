# Render Blueprint: one web service + one PostgreSQL database.
# Deploy: https://render.com/deploy?repo=https://github.com/Adebowale-123/nextGen
databases:
  - name: nextgen-db
    plan: free
    databaseName: nextgen
    user: nextgen

services:
  - type: web
    name: nextgen-game
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 2 --timeout 60"
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: DATABASE_URL
        fromDatabase:
          name: nextgen-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TICKET_SIGNING_KEY
        generateValue: true
      - key: MOCK_GATEWAY_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"
      # Render already redirects http -> https at its edge.
      - key: SECURE_SSL_REDIRECT
        value: "false"
      # Public test version: sandbox payments only, codes shown on screen, demo banner.
      - key: DEMO_MODE
        value: "true"
      - key: PAYMENT_PROVIDERS
        value: mock
      - key: PAYOUT_PROVIDER
        value: mock
      - key: KYC_PROVIDER
        value: mock
      # No always-on worker on the free plan: advance games on incoming requests.
      - key: SCHEDULER_ON_REQUEST
        value: "true"
      # First back-office login. You type these in Render when deploying; they are never in git.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

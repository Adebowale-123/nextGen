{% extends "base.html" %}
{% block title %}Finish signing up{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Almost there</h1>
  <p class="muted">Signing up as <b>{{ email }}</b>. We need your date of birth to confirm you're 18+.</p>
  <form method="post">
    {% csrf_token %}
    {% include "partials/form.html" %}
    <button class="btn btn-accent btn-block btn-lg" type="submit">Create account</button>
  </form>
</div>
{% endblock %}

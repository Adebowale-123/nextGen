{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Welcome back</h1>
  {% if google_enabled %}
    <a class="btn btn-google btn-block" href="{% url 'accounts:google_start' %}">Continue with Google</a>
    <div class="divider">or</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.GET.next }}">
    {% include "partials/form.html" %}
    <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
  </form>
  <p class="center" style="margin-top:16px">New here? <a href="{% url 'accounts:register' %}">Create an account</a></p>
</div>
{% endblock %}

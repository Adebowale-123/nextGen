{% load nextgen %}
<a class="card draw-card simple" href="{% url 'games:draw_detail' draw.pk %}">
  <div class="row between">
    <h3 class="mb-0">{{ draw.game.name }}</h3>
    <span class="price">{{ draw.game.ticket_price|coins }}</span>
  </div>
  <div>
    <div class="countdown-label">Closes in</div>
    <div class="countdown" data-countdown="{{ draw.closes_at.isoformat }}">--:--:--</div>
  </div>
  <span class="btn btn-primary btn-block">Play</span>
</a>

{% if page.has_other_pages %}
<nav class="pagination">
  {% if page.has_previous %}<a class="btn btn-ghost btn-sm" href="?{% if extra_qs %}{{ extra_qs }}&{% endif %}page={{ page.previous_page_number }}">← Newer</a>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-ghost btn-sm" href="?{% if extra_qs %}{{ extra_qs }}&{% endif %}page={{ page.next_page_number }}">Older →</a>{% endif %}
</nav>
{% endif %}
